services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urbanflow-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    volumes:
      - ./backend/diagnosticos_iim.db:/app/diagnosticos_iim.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urbanflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
